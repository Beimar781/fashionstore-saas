name: Compilar APK

# Se lanza a mano: pestaña Actions → «Compilar APK» → Run workflow. El .apk queda como artefacto de esa ejecución.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe la variable API_URL
        working-directory: .
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta la variable API_URL (Settings → Secrets and variables → Actions → Variables). Ejemplo: https://backend-produccion.up.railway.app/api"
            exit 1
          fi
          case "$API_URL" in
            https://*/api) ;;
            *) echo "::error::API_URL debe empezar con https:// y terminar en /api (el APK de release no admite tráfico sin cifrar)."; exit 1 ;;
          esac

      # Firebase (avisos push nativos): google-services.json no se sube al repositorio; se guarda su contenido en el secreto GOOGLE_SERVICES_JSON
      # (Settings → Secrets and variables → Actions → Secrets). Si no existe, el APK se compila sin Firebase y los avisos se muestran dentro de la app.
      - name: Preparar google-services.json
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > movil/android/app/google-services.json
            echo "google-services.json creado desde el secreto GOOGLE_SERVICES_JSON: el APK llevará Firebase."
          elif [ -f movil/android/app/google-services.json ]; then
            echo "google-services.json viene del repositorio: el APK llevará Firebase."
          else
            echo "::warning::No hay google-services.json ni secreto GOOGLE_SERVICES_JSON: el APK se compila SIN Firebase (avisos dentro de la app)."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Compilar el APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: fashionstore-apk
          path: movil/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Abre el APK en un emulador y comprueba que no se cierra al arrancar. Si el emulador no está disponible, el APK igual se entrega.
  prueba_arranque:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fashionstore-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en un emulador
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell monkey -p com.example.fashionstore_movil -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb shell pidof com.example.fashionstore_movil > pid.txt || true
            if grep -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | grep -q "fashionstore_movil"; then echo "La app se cerró al arrancar (ver logcat-arranque)."; exit 1; fi
            if [ ! -s pid.txt ]; then echo "La app no sigue en ejecución 25 segundos después de abrirla."; exit 1; fi
            echo "La app arrancó y sigue en ejecución."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-arranque
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumen de la prueba de arranque
        if: always()
        run: echo "Prueba de arranque en emulador (API 34): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
